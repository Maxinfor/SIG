<script>
        // ================= LISTA DE ASSUNTOS COMUNS (CONSELHO TUTELAR) =================
        const listaAssuntosComuns = [
            "Acompanhamento Escolar / Frequência",
            "Acolhimento Institucional (Abrigo)",
            "Ameaça / Violação de Direitos",
            "Atendimento Psicológico / Saúde Mental",
            "Negligência / Abandono de Incapaz",
            "Suspeita de Maus-Tratos / Violência Física",
            "Violência Psicológica / Moral",
            "Violência Sexual / Abuso",
            "Trabalho Infantil",
            "Disputa de Guarda / Conflito Familiar",
            "Evasão Escolar",
            "Falta de Vaga em Creche / Escola",
            "Acesso a Medicamentos / Tratamento Médico",
            "Ato Infracional",
            "Orientação Familiar",
            "Outros / Demanda Administrativa"
        ];

        // ================= VARIÁVEIS GLOBAIS DE DADOS =================
        let registros = JSON.parse(localStorage.getItem('ct_registros')) || [];
        let atendimentos = JSON.parse(localStorage.getItem('ct_atendimentos')) || [];

        // Inicialização ao carregar a página
        window.onload = function() {
            atualizarTabela();
            atualizarTabelaAtendimentos();
            atualizarDashboardEstatisticas();
            atualizarContadoresDashAtendimentos();
            
            // Definir data e hora atual no formulário de atendimento
            const agora = new Date();
            const dataFormatada = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('spanDataHoje').innerText = new Date().toLocaleDateString('pt-BR');
            document.getElementById('atendDataHora').value = dataFormatada;

            // Configurar autocompletes
            configurarAutocomplete('assuntoInput', 'assuntoAutocompleteList', listaAssuntosComuns);
            configurarAutocomplete('atendAssuntoInput', 'atendAssuntoAutocompleteList', listaAssuntosComuns);
        };

        // ================= SISTEMA DE ABAS =================
        function alternarAba(idAba, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(idAba).classList.add('active');
            btnElement.classList.add('active');
        }

        // ================= TOGGLE DASHBOARD =================
        function toggleDashboard() {
            const wrap = document.getElementById('dashboardContainerWrap');
            const icon = document.getElementById('iconToggleDash');
            const text = document.getElementById('textToggleDash');
            
            if (wrap.style.display === 'none') {
                wrap.style.display = 'block';
                icon.className = 'fa-solid fa-eye-slash';
                text.innerText = 'Esconder Dashboard Estatístico';
            } else {
                wrap.style.display = 'none';
                icon.className = 'fa-solid fa-eye';
                text.innerText = 'Mostrar Dashboard Estatístico';
            }
        }

        // ================= CAMPOS DINÂMICOS (CRIANÇAS E RESPONSÁVEIS) =================
        function adicionarCampoCrianca() {
            const container = document.getElementById('criancasContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <input type="text" class="nomeCrianca" placeholder="Nome Completo" oninput="calcularPastaAutomatica()">
                <button type="button" class="btn-remove" onclick="removerCampo(this); calcularPastaAutomatica();"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function adicionarCampo(containerId, classeInput, placeholderText) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <input type="text" class="${classeInput}" placeholder="${placeholderText}">
                <button type="button" class="btn-remove" onclick="removerCampo(this)"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function removerCampo(btn) {
            const item = btn.parentElement;
            if (item.parentElement.children.length > 1) {
                item.remove();
            } else {
                alert("É necessário manter ao menos um campo.");
            }
        }

        // ================= GERAÇÃO AUTOMÁTICA DA PASTA =================
        function calcularPastaAutomatica() {
            const inputs = document.querySelectorAll('.nomeCrianca');
            let primeiroNomeValido = "";
            for (let input of inputs) {
                if (input.value.trim() !== "") {
                    primeiroNomeValido = input.value.trim();
                    break;
                }
            }
            document.getElementById('pasta').value = primeiroNomeValido;
        }

        // ================= AUTOCOMPLETE GENÉRICO =================
        function configurarAutocomplete(inputId, listId, arrDados) {
            const input = document.getElementById(inputId);
            const listContainer = document.getElementById(listId);

            input.addEventListener('input', function() {
                const val = this.value;
                listContainer.innerHTML = '';
                if (!val) return;

                const match = arrDados.filter(item => item.toLowerCase().includes(val.toLowerCase()));
                match.forEach(item => {
                    const div = document.createElement('div');
                    div.innerHTML = item;
                    div.addEventListener('click', function() {
                        input.value = item;
                        listContainer.innerHTML = '';
                    });
                    listContainer.appendChild(div);
                });
            });

            document.addEventListener('click', function(e) {
                if (e.target !== input) {
                    listContainer.innerHTML = '';
                }
            });
        }

        // ================= CRUD DE PROCESSOS =================
        function salvarRegistro() {
            calcularPastaAutomatica();
            const pasta = document.getElementById('pasta').value.trim();
            const numProces = document.getElementById('numProces').value.trim();
            const dataNasc = document.getElementById('dataNasc').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            const assunto = document.getElementById('assuntoInput').value.trim();
            const conselheiro = document.getElementById('conselheiro').value;
            const processoSeiNum = document.getElementById('processoSeiNum').value.trim();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!pasta) {
                alert("Por favor, preencha pelo menos o nome de uma criança para gerar a pasta.");
                return;
            }

            // Coletar crianças
            const criancas = [];
            document.querySelectorAll('.nomeCrianca').forEach(i => {
                if(i.value.trim()) criancas.push(i.value.trim());
            });

            // Coletar responsáveis
            const responsaveis = [];
            document.querySelectorAll('.nomeResponsavel').forEach(i => {
                if(i.value.trim()) responsaveis.push(i.value.trim());
            });

            const objRegistro = {
                pasta,
                numProces,
                criancas,
                dataNasc,
                responsaveis,
                endereco,
                cidade,
                assunto,
                conselheiro,
                processoSeiNum,
                historicoServicos: editIndex >= 0 && registros[editIndex] ? registros[editIndex].historicoServicos || [] : []
            };

            if (editIndex >= 0) {
                registros[editIndex] = objRegistro;
                document.getElementById('editIndex').value = -1;
                mostrarStatus("Registro atualizado com sucesso!");
            } else {
                registros.push(objRegistro);
                mostrarStatus("Registro cadastrado com sucesso!");
            }

            localStorage.setItem('ct_registros', JSON.stringify(registros));
            limparFormulario();
            atualizarTabela();
            atualizarDashboardEstatisticas();
        }

        function mostrarStatus(msg) {
            const box = document.getElementById('statusBox');
            box.innerText = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3500);
        }

        function limparFormulario() {
            document.getElementById('processoForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('pasta').value = '';
            // Resetar listas dinâmicas para 1 item padrão
            document.getElementById('criancasContainer').innerHTML = '<div class="dynamic-item"><input type="text" class="nomeCrianca" placeholder="Nome Completo" oninput="calcularPastaAutomatica()"></div>';
            document.getElementById('responsaveisContainer').innerHTML = '<div class="dynamic-item"><input type="text" class="nomeResponsavel" placeholder="Nome Completo"></div>';
        }

        function tentarLimparFormulario() {
            if(confirm("Deseja realmente limpar todos os campos preenchidos?")) {
                limparFormulario();
            }
        }

        function atualizarTabela(dadosExibir = registros) {
            const tbody = document.querySelector('#tabelaRegistros tbody');
            tbody.innerHTML = '';
            
            document.getElementById('contadorRegistros').innerText = `Total: ${dadosExibir.length} registros`;

            if (dadosExibir.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #64748b; padding: 20px;">Nenhum dado cadastrado.</td></tr>';
                return;
            }

            dadosExibir.forEach((reg, index) => {
                const tr = document.createElement('tr');
                const criancasStr = Array.isArray(reg.criancas) ? reg.criancas.join(', ') : reg.pasta;
                const respStr = Array.isArray(reg.responsaveis) ? reg.responsaveis.join(', ') : (reg.responsavel || '');

                tr.innerHTML = `
                    <td><strong>${reg.pasta || '---'}</strong></td>
                    <td>${reg.numProces || '---'}</td>
                    <td>${criancasStr}</td>
                    <td>${reg.dataNasc || '---'}</td>
                    <td>${respStr}</td>
                    <td>${reg.endereco || '---'}</td>
                    <td>${reg.cidade || 'Paranoá'}</td>
                    <td>${reg.assunto || '---'}</td>
                    <td>${reg.conselheiro || '---'}</td>
                    <td>${reg.processoSeiNum || '---'}</td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button type="button" class="btn-acao btn-historico" title="Histórico / Serviços" onclick="abrirModalHistorico(${index})"><i class="fa-solid fa-clock-rotate-left"></i></button>
                        <button type="button" class="btn-acao btn-editar" title="Editar" onclick="editarRegistro(${index})"><i class="fa-solid fa-pen"></i></button>
                        <button type="button" class="btn-acao btn-deletar" title="Excluir" onclick="deletarRegistro(${index})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function pesquisarProcessos() {
            const termo = document.getElementById('inputPesquisaProcessos').value.toLowerCase();
            if (!termo) {
                atualizarTabela(registros);
                return;
            }
            const filtrados = registros.filter(r => {
                const criancas = Array.isArray(r.criancas) ? r.criancas.join(' ').toLowerCase() : '';
                const resp = Array.isArray(r.responsaveis) ? r.responsaveis.join(' ').toLowerCase() : '';
                return (r.pasta && r.pasta.toLowerCase().includes(termo)) ||
                       (r.numProces && r.numProces.toLowerCase().includes(termo)) ||
                       (r.assunto && r.assunto.toLowerCase().includes(termo)) ||
                       criancas.includes(termo) || resp.includes(termo);
            });
            atualizarTabela(filtrados);
        }

        function editarRegistro(index) {
            const reg = registros[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('pasta').value = reg.pasta || '';
            document.getElementById('numProces').value = reg.numProces || '';
            document.getElementById('dataNasc').value = reg.dataNasc || '';
            document.getElementById('endereco').value = reg.endereco || '';
            document.getElementById('cidade').value = reg.cidade || 'Paranoá';
            document.getElementById('assuntoInput').value = reg.assunto || '';
            document.getElementById('conselheiro').value = reg.conselheiro || '';
            document.getElementById('processoSeiNum').value = reg.processoSeiNum || '';

            // Preencher crianças dinâmicas
            const cContainer = document.getElementById('criancasContainer');
            cContainer.innerHTML = '';
            const arrC = reg.criancas && reg.criancas.length > 0 ? reg.criancas : [reg.pasta];
            arrC.forEach(c => {
                const div = document.createElement('div');
                div.className = 'dynamic-item';
                div.innerHTML = `
                    <input type="text" class="nomeCrianca" value="${c}" placeholder="Nome Completo" oninput="calcularPastaAutomatica()">
                    <button type="button" class="btn-remove" onclick="removerCampo(this); calcularPastaAutomatica();"><i class="fa-solid fa-trash"></i></button>
                `;
                cContainer.appendChild(div);
            });

            // Preencher responsáveis dinâmicos
            const rContainer = document.getElementById('responsaveisContainer');
            rContainer.innerHTML = '';
            const arrR = reg.responsaveis && reg.responsaveis.length > 0 ? reg.responsaveis : (reg.responsavel ? [reg.responsavel] : [""]);
            arrR.forEach(r => {
                const div = document.createElement('div');
                div.className = 'dynamic-item';
                div.innerHTML = `
                    <input type="text" class="nomeResponsavel" value="${r}" placeholder="Nome Completo">
                    <button type="button" class="btn-remove" onclick="removerCampo(this)"><i class="fa-solid fa-trash"></i></button>
                `;
                rContainer.appendChild(div);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deletarRegistro(index) {
            if(confirm("Deseja realmente excluir este registro permanentemente?")) {
                registros.splice(index, 1);
                localStorage.setItem('ct_registros', JSON.stringify(registros));
                atualizarTabela();
                atualizarDashboardEstatisticas();
            }
        }

        // ================= MODAL DE HISTÓRICO =================
        function abrirModalHistorico(index) {
            document.getElementById('historicoIndexAtual').value = index;
            const reg = registros[index];
            document.getElementById('modalTituloPasta').innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> Histórico: Pasta ${reg.pasta}`;
            document.getElementById('modalSubInfo').innerText = `Processo Nº: ${reg.numProces || '---'} | Assunto Principal: ${reg.assunto || '---'}`;
            
            document.getElementById('novoServicoData').value = new Date().toLocaleDateString('pt-BR');
            document.getElementById('novoServicoConselheiro').value = reg.conselheiro || '';
            document.getElementById('novoServicoDescricao').value = '';

            atualizarTabelaHistoricoServicos(reg);
            document.getElementById('modalHistorico').style.display = 'flex';
        }

        function fecharModalHistorico() {
            document.getElementById('modalHistorico').style.display = 'none';
        }

        function adicionarNovoServicoNaPasta() {
            const index = parseInt(document.getElementById('historicoIndexAtual').value);
            const data = document.getElementById('novoServicoData').value.trim();
            const conselheiro = document.getElementById('novoServicoConselheiro').value.trim();
            const descricao = document.getElementById('novoServicoDescricao').value.trim();

            if (!data || !descricao) {
                alert("Preencha a data e a descrição do serviço prestado.");
                return;
            }

            if (!registros[index].historicoServicos) {
                registros[index].historicoServicos = [];
            }

            registros[index].historicoServicos.push({ data, conselheiro, descricao });
            localStorage.setItem('ct_registros', JSON.stringify(registros));

            document.getElementById('novoServicoDescricao').value = '';
            atualizarTabelaHistoricoServicos(registros[index]);
        }

        function atualizarTabelaHistoricoServicos(reg) {
            const tbody = document.querySelector('#tabelaHistoricoServicos tbody');
            tbody.innerHTML = '';
            const servicos = reg.historicoServicos || [];

            if (servicos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 15px;">Nenhum serviço registrado no histórico desta pasta.</td></tr>';
                return;
            }

            servicos.forEach((serv, sIdx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${serv.data}</td>
                    <td>${serv.conselheiro || '---'}</td>
                    <td>${serv.descricao}</td>
                    <td style="text-align: center;">
                        <button type="button" class="btn-remove" style="padding: 4px 8px;" onclick="deletarServicoHistorico(${sIdx})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deletarServicoHistorico(sIdx) {
            const regIndex = parseInt(document.getElementById('historicoIndexAtual').value);
            registros[regIndex].historicoServicos.splice(sIdx, 1);
            localStorage.setItem('ct_registros', JSON.stringify(registros));
            atualizarTabelaHistoricoServicos(registros[regIndex]);
        }

        // ================= ABA 2: ATOS DE ATENDIMENTO (RECEPÇÃO) =================
        function salvarAtendimento() {
            const nome = document.getElementById('atendNome').value.trim();
            const cidade = document.getElementById('atendCidade').value.trim();
            const assunto = document.getElementById('atendAssuntoInput').value.trim();
            const dataHora = document.getElementById('atendDataHora').value.trim();

            if (!nome) {
                alert("Por favor, preencha o nome da pessoa atendida.");
                return;
            }

            const novoAtendimento = { nome, cidade, assunto, dataHora };
            atendimentos.push(novoAtendimento);
            localStorage.setItem('ct_atendimentos', JSON.stringify(atendimentos));

            document.getElementById('atendNome').value = '';
            document.getElementById('atendAssuntoInput').value = '';
            
            atualizarTabelaAtendimentos();
            atualizarContadoresDashAtendimentos();
            alert("Atendimento registrado com sucesso!");
        }

        function atualizarTabelaAtendimentos() {
            const tbody = document.querySelector('#tabelaAtendimentos tbody');
            tbody.innerHTML = '';
            document.getElementById('contadorAtendimentos').innerText = `Total: ${atendimentos.length}`;

            if (atendimentos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 20px;">Nenhum atendimento registrado.</td></tr>';
                return;
            }

            atendimentos.slice().reverse().forEach((atend, indexReal) => {
                const indexOriginal = atendimentos.length - 1 - indexReal;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${atend.dataHora}</td>
                    <td><strong>${atend.nome}</strong></td>
                    <td>${atend.cidade}</td>
                    <td>${atend.assunto || '---'}</td>
                    <td style="text-align: center;">
                        <button type="button" class="btn-acao btn-deletar" onclick="deletarAtendimento(${indexOriginal})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deletarAtendimento(index) {
            if(confirm("Deseja excluir este registro de atendimento?")) {
                atendimentos.splice(index, 1);
                localStorage.setItem('ct_atendimentos', JSON.stringify(atendimentos));
                atualizarTabelaAtendimentos();
                atualizarContadoresDashAtendimentos();
            }
        }

        function limparFormAtendimento() {
            document.getElementById('atendNome').value = '';
            document.getElementById('atendAssuntoInput').value = '';
        }

        function atualizarContadoresDashAtendimentos() {
            document.getElementById('dashTotalAtendimentos').innerText = atendimentos.length;
            const unicas = new Set(atendimentos.map(a => a.nome.toLowerCase().trim())).size;
            document.getElementById('dashPessoasUnicas').innerText = unicas;
        }

        // ================= DASHBOARD ESTATÍSTICO DE PROCESSOS =================
        function atualizarDashboardEstatisticas() {
            const mesFiltro = document.getElementById('filtroMes').value;
            const anoFiltro = document.getElementById('filtroAno').value;

            // Filtrar registros se necessário (se houver campo de data cadastrada no futuro, por enquanto usa todos ou baseia nos serviços)
            const dadosFiltrados = registros; 

            // Estatísticas por Assunto
            const contAssuntos = {};
            // Estatísticas por Cidade/Localidade
            const contCidades = {};

            dadosFiltrados.forEach(r => {
                const assunto = r.assunto ? r.assunto.trim() : "Não Informado";
                contAssuntos[assunto] = (contAssuntos[assunto] || 0) + 1;

                const cidade = r.cidade ? r.cidade.trim() : "Paranoá";
                contCidades[cidade] = (contCidades[cidade] || 0) + 1;
            });

            // Renderizar Lista de Assuntos
            const listaAssuntosEl = document.getElementById('listaAssuntosDash');
            listaAssuntosEl.innerHTML = '';
            let totalAssuntos = 0;

            const assuntosOrdenados = Object.entries(contAssuntos).sort((a,b) => b[1] - a[1]);
            if (assuntosOrdenados.length === 0) {
                listaAssuntosEl.innerHTML = '<li style="color: #64748b; text-align: center; display: block; padding: 15px;">Nenhum dado no período.</li>';
            } else {
                assuntosOrdenados.forEach(([assunto, qtd]) => {
                    totalAssuntos += qtd;
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${assunto}</span> <span class="dash-badge">${qtd}</span>`;
                    listaAssuntosEl.appendChild(li);
                });
            }
            document.getElementById('totalAssuntosCount').innerText = totalAssuntos;

            // Renderizar Lista de Cidades / Localidades
            const listaCidadesEl = document.getElementById('listaCidadesDash');
            listaCidadesEl.innerHTML = '';
            const cidadesOrdenadas = Object.entries(contCidades).sort((a,b) => b[1] - a[1]);
            
            if (cidadesOrdenadas.length === 0) {
                listaCidadesEl.innerHTML = '<li style="color: #64748b; text-align: center; display: block; padding: 15px;">Nenhum dado no período.</li>';
                document.getElementById('regiaoDestaque').innerText = 'Destaque: ---';
            } else {
                document.getElementById('regiaoDestaque').innerText = `Destaque: ${cidadesOrdenadas[0][0]} (${cidadesOrdenadas[0][1]})`;
                cidadesOrdenadas.forEach(([cidade, qtd]) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${cidade}</span> <span class="dash-badge">${qtd}</span>`;
                    listaCidadesEl.appendChild(li);
                });
            }
        }

        // ================= IMPORTAÇÃO EXCEL / TEXTO COLADO =================
        function processarPlanilha(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    converterEImportarLinhas(json);
                } catch (err) {
                    alert("Erro ao ler o arquivo Excel: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processarDadosColados(e) {
            setTimeout(() => {
                const texto = document.getElementById('pasteInput').value;
                if (!texto) return;
                const linhas = texto.split('\n').map(l => l.split('\t'));
                converterEImportarLinhas(linhas);
                document.getElementById('pasteInput').value = '';
            }, 100);
        }

        function clicarColar() {
            const texto = document.getElementById('pasteInput').value;
            if (!texto) {
                alert("Cole os dados do Excel na caixa de texto primeiro.");
                return;
            }
            const linhas = texto.split('\n').map(l => l.split('\t'));
            converterEImportarLinhas(linhas);
            document.getElementById('pasteInput').value = '';
        }

        function converterEImportarLinhas(linhas) {
            let importadosCount = 0;
            linhas.forEach((cols, idx) => {
                if (idx === 0 && (cols[0]?.toLowerCase().includes('pasta') || cols[0]?.toLowerCase().includes('nome'))) {
                    return; // Pular cabeçalho provável
                }
                if (cols.length >= 2 && cols[0]?.trim() !== "") {
                    const novoReg = {
                        pasta: cols[0]?.trim() || '',
                        numProces: cols[1]?.trim() || '',
                        criancas: [cols[2]?.trim() || cols[0]?.trim()],
                        dataNasc: cols[3]?.trim() || '',
                        responsaveis: [cols[4]?.trim() || ''],
                        endereco: cols[5]?.trim() || '',
                        cidade: cols[6]?.trim() || 'Paranoá',
                        assunto: cols[7]?.trim() || '',
                        conselheiro: cols[8]?.trim() || '',
                        processoSeiNum: cols[9]?.trim() || '',
                        historicoServicos: []
                    };
                    registros.push(novoReg);
                    importadosCount++;
                }
            });

            if (importadosCount > 0) {
                localStorage.setItem('ct_registros', JSON.stringify(registros));
                atualizarTabela();
                atualizarDashboardEstatisticas();
                alert(`${importadosCount} registros importados com sucesso!`);
            } else {
                alert("Nenhum registro válido encontrado nos dados informados.");
            }
        }
    </script>
</body>
</html>
